<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <title>推送到 DIAN115</title>
</head>
<body style="width: 380px">
  <div class="wrap">
    <div class="card">
      <div class="row between">
        <div class="row grow">
          <span id="conn-dot" class="dot"></span>
          <strong class="grow ellipsis" id="page-title">正在读取当前页面…</strong>
        </div>
        <button class="ghost tiny" id="open-options" title="设置">设置</button>
      </div>
      <div class="small muted ellipsis" id="page-url"></div>
      <div class="row" style="margin-top:10px">
        <select id="mode" class="grow" title="下载模式">
          <option value="video">视频</option>
          <option value="audio">仅音频</option>
        </select>
        <button class="primary" id="push-page">推送</button>
        <button id="probe-list" title="先展开节目单再推送">节目单</button>
      </div>
    </div>

    <div class="card banner" id="pending-card" hidden>
      <h2>本次需要确认</h2>
      <div class="small" id="pending-text"></div>
      <div class="actions">
        <button class="primary" id="pending-confirm">确认加入</button>
        <button id="pending-cancel">取消</button>
      </div>
    </div>

    <div class="card" id="preview-card" hidden>
      <div class="row between">
        <h2 class="grow ellipsis" id="preview-title"></h2>
        <span class="tag" id="preview-probe"></span>
      </div>
      <img class="preview-thumb" id="preview-thumb" hidden alt="">
      <div class="small muted" id="preview-source"></div>
      <div class="stats" id="preview-stats"></div>
      <ul class="items" id="preview-items" hidden></ul>
      <div class="actions">
        <button class="primary" id="preview-push">加入下载队列</button>
        <button id="preview-close">收起</button>
      </div>
    </div>

    <div class="card">
      <div class="row between">
        <h2>最近推送</h2>
        <div class="row">
          <button class="ghost tiny" id="refresh">刷新</button>
          <button class="ghost tiny" id="clear">清空</button>
        </div>
      </div>
      <div id="tasks"></div>
    </div>

    <div class="card" id="card-115">
      <div class="row between">
        <h2 class="grow">115 转存 / 离线</h2>
        <span class="tag" id="p115-kind">未识别</span>
      </div>
      <div class="small muted ellipsis" id="p115-link">当前页面不是 115 分享 / 磁力 / ED2K 链接</div>
      <label class="field">
        <span>使用账号</span>
        <select id="p115-account"></select>
      </label>
      <div class="row" style="margin-top:6px">
        <button id="p115-share-browse">转存目录</button>
        <span class="small muted ellipsis grow" id="p115-share-name">未选择</span>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="p115-offline-browse">离线目录</button>
        <span class="small muted ellipsis grow" id="p115-offline-name">未选择</span>
      </div>
      <div class="card" id="p115-browser" hidden style="margin:8px 0 0;background:var(--soft)">
        <div class="row between">
          <div class="small muted ellipsis grow" id="p115-path">115 根目录</div>
          <button class="ghost tiny" id="p115-up">上一级</button>
        </div>
        <div id="p115-dirs" class="small" style="margin-top:6px;max-height:160px;overflow:auto"></div>
        <div class="row" style="margin-top:8px">
          <button class="primary grow" id="p115-choose">选当前目录</button>
          <button id="p115-close">收起</button>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="primary grow" id="p115-push">推送到 115</button>
        <button id="p115-save">保存为默认</button>
      </div>
      <div class="hint" id="p115-status" hidden></div>
    </div>

    <div class="footer">
      <a href="#" id="open-in-server" hidden>在 DIAN115 中查看</a>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
